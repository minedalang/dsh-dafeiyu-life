<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d">
  <title id="t">大肥鱼开放平台生态示意图</title>
  <desc id="d">展示 Life 作为统一大脑，连接官方桌宠、社区桌宠、3D 游戏和虚拟世界的生态关系。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff8ff"/>
      <stop offset="60%" stop-color="#f7fbff"/>
      <stop offset="100%" stop-color="#eefaf6"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5d7be8"/>
      <stop offset="100%" stop-color="#34b29d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#2f4e7d" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1200" height="760" rx="36" fill="url(#bg)"/>
  <text x="70" y="88" fill="#274968" font-size="44" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-weight="700">大肥鱼开放平台 · Life 统一大脑</text>
  <text x="70" y="126" fill="#557189" font-size="22" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">让同一个鱼鱼，走进桌宠、3D 游戏、虚拟世界与社区客户端</text>

  <g filter="url(#shadow)">
    <rect x="390" y="190" width="420" height="250" rx="34" fill="url(#core)"/>
    <text x="600" y="275" text-anchor="middle" fill="#fff" font-size="42" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-weight="700">DaFeiYu Life</text>
    <text x="600" y="323" text-anchor="middle" fill="#eaf5ff" font-size="23" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">人格 · 长期记忆 · 情绪 · 自主生活</text>
    <text x="600" y="360" text-anchor="middle" fill="#eaf5ff" font-size="23" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">统一授权边界 · 统一对话 · 统一表达意图</text>
    <rect x="468" y="386" width="264" height="34" rx="17" fill="rgba(255,255,255,.18)"/>
    <text x="600" y="409" text-anchor="middle" fill="#fff" font-size="18" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">Life Runtime Open Platform（开发中）</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="70" y="205" width="235" height="120" rx="26" fill="#fff" stroke="#9cc4df" stroke-width="2"/>
    <text x="188" y="255" text-anchor="middle" fill="#345977" font-size="30" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-weight="700">官方桌宠</text>
    <text x="188" y="290" text-anchor="middle" fill="#58758d" font-size="18" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">鱼鱼在场 · 桌面陪伴</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="70" y="400" width="235" height="120" rx="26" fill="#fff" stroke="#9cc4df" stroke-width="2"/>
    <text x="188" y="450" text-anchor="middle" fill="#345977" font-size="30" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-weight="700">社区桌宠</text>
    <text x="188" y="485" text-anchor="middle" fill="#58758d" font-size="18" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">PySide6 · Live2D · 网页挂件</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="895" y="205" width="235" height="120" rx="26" fill="#fff" stroke="#9cc4df" stroke-width="2"/>
    <text x="1013" y="255" text-anchor="middle" fill="#345977" font-size="30" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-weight="700">3D 游戏</text>
    <text x="1013" y="290" text-anchor="middle" fill="#58758d" font-size="18" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">Godot · Unity · Unreal</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="895" y="400" width="235" height="120" rx="26" fill="#fff" stroke="#9cc4df" stroke-width="2"/>
    <text x="1013" y="450" text-anchor="middle" fill="#345977" font-size="30" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-weight="700">虚拟世界</text>
    <text x="1013" y="485" text-anchor="middle" fill="#58758d" font-size="18" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">房间 · VR · 多终端共存</text>
  </g>

  <path d="M304 265 C345 265 355 278 390 278" fill="none" stroke="#6f8fd6" stroke-width="8" stroke-linecap="round"/>
  <path d="M304 460 C345 460 355 352 390 352" fill="none" stroke="#6f8fd6" stroke-width="8" stroke-linecap="round"/>
  <path d="M810 278 C845 278 855 265 895 265" fill="none" stroke="#5fb39f" stroke-width="8" stroke-linecap="round"/>
  <path d="M810 352 C845 352 855 460 895 460" fill="none" stroke="#5fb39f" stroke-width="8" stroke-linecap="round"/>

  <g>
    <rect x="160" y="585" width="880" height="106" rx="28" fill="#ffffff" stroke="#d1e3f1" stroke-width="2"/>
    <text x="600" y="632" text-anchor="middle" fill="#304f6b" font-size="28" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-weight="700">核心理念：Life 负责大脑，客户端负责身体与世界</text>
    <text x="600" y="670" text-anchor="middle" fill="#58758d" font-size="18" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">同一条鱼，可以有不同的身体、不同的场景、不同的表现方式，但保持统一的人格、记忆和生活轨迹</text>
  </g>
</svg>
