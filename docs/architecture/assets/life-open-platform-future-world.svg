<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-labelledby="fw-title fw-desc">
<title id="fw-title">鱼鱼未来可能拥有的小房间</title><desc id="fw-desc">温暖的未来桌宠场景示意。鱼鱼在房间里，旁边展示了观察、休息、交流三种生活状态。此功能仍为未来设想。</desc>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F1F4FF"/><stop offset=".6" stop-color="#F4FBF7"/><stop offset="1" stop-color="#FDF8EE"/></linearGradient>
<linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#E8F0FF"/></linearGradient>
<linearGradient id="fish" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#72A8F3"/><stop offset="1" stop-color="#6DD4C3"/></linearGradient>
<filter id="shadow" x="-30%" y="-40%" width="160%" height="190%"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#35466B" flood-opacity=".15"/></filter>
</defs>
<rect width="1200" height="710" rx="30" fill="url(#sky)"/>
<text x="65" y="88" font-size="40" font-family='"Noto Sans CJK SC", "Microsoft YaHei", sans-serif' fill="#2B4362" font-weight="700">如果鱼鱼有自己的小房间</text>
<text x="65" y="124" font-size="19" font-family='"Noto Sans CJK SC", "Microsoft YaHei", sans-serif' fill="#60758B">以后，她也许能在这里看看世界、聊天，或者安静休息</text>
<rect x="1040" y="56" width="103" height="36" rx="18" fill="#FBE9CF"/><text x="1091" y="80" text-anchor="middle" font-size="16" font-family='"Noto Sans CJK SC", "Microsoft YaHei", sans-serif' font-weight="700" fill="#966B32">未来设想</text>
