name: GitHub Release (Dafeiyu Life)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  runtime-packages:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - win32-x64
          - win32-arm64
          - darwin-arm64
          - darwin-x64
          - linux-x64
          - linux-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare platform-bundled llama.cpp Runtime (no model weights)
        run: |
          npm ci --ignore-scripts
          node scripts/prepare-embedding-runtime.mjs --target=${{ matrix.target }}
      - name: Package DSH with the matching platform Runtime
        shell: bash
        run: |
          mkdir -p dist
          npm pack --ignore-scripts --pack-destination dist
          mv dist/dsh-dafeiyu-life-*.tgz "dist/dsh-dafeiyu-life-${{ matrix.target }}.tgz"
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-package-${{ matrix.target }}
          path: dist/dsh-dafeiyu-life-${{ matrix.target }}.tgz
          if-no-files-found: error

  release:
    needs: runtime-packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          npm ci --ignore-scripts
          python -m pip install pillow
      - name: Verify tag matches package version
        shell: bash
        run: |
          test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")" || {
            echo 'Git tag must equal v<package.json version>' >&2
            exit 1
          }
          test "$(node -p "require('./package.json').name")" = 'dsh-dafeiyu-life'
          version="$(node -p "require('./package.json').version")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-dev\.[1-9][0-9]*|-rc\.[1-9][0-9]*)?$ ]] || {
            echo 'Tag version must be stable or supported dev/rc prerelease' >&2
            exit 1
          }
          if [[ "$version" != *-* ]]; then
            # A stable tag must point at a commit already merged into main.
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
              echo 'Stable release tag must reference a commit merged into main' >&2
              exit 1
            }
            # Refuse stable tags while the CURRENT user-facing material still
            # says preview. The old filtered grep missed actual dev.16 wording.
            ! grep -Eq '关于当前.*预览版|当前开发版本：|尚未正式发布|尚未上架 npm' README.md || {
              echo 'Stable release README still identifies a preview build' >&2
              exit 1
            }
            ! grep -Eq '开发预览提醒|开发预览，尚未发布|当前交付代码仍是|当前构建标记为.*dev' "RELEASE_NOTES_${GITHUB_REF_NAME}.md" || {
              echo 'Stable release notes still identify a preview build' >&2
              exit 1
            }
          fi
      - name: Syntax checks
        run: |
          node --check index.js
          node --check client.js
          node --check selfcheck.mjs
      - name: Full Node.js regression tests
        run: node --test test/*.test.mjs
      - name: Full Python regression tests
        run: python -m unittest discover -s test -p 'test*.py'
      - name: Plugin self-check and package manifest verification
        run: |
          node selfcheck.mjs
          npm pack --dry-run --ignore-scripts > /dev/null
      - name: Download platform-specific install packages
        uses: actions/download-artifact@v4
        with:
          pattern: dsh-package-*
          path: release-assets
          merge-multiple: true
      - name: Checksum platform-specific install packages
        run: |
          sha256sum release-assets/*.tgz > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Detect version-specific release notes
        id: release_notes
        shell: bash
        run: |
          note_file="RELEASE_NOTES_${GITHUB_REF_NAME}.md"
          if ! test -f "$note_file"; then
            # Prerelease tags use the upcoming stable version's notes during dev.
            base_tag="${GITHUB_REF_NAME%%-*}"
            note_file="RELEASE_NOTES_${base_tag}.md"
          fi
          if test -f "$note_file"; then
            echo "body_path=$note_file" >> "$GITHUB_OUTPUT"
            echo 'has_notes=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_notes=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Publish Dafeiyu Life GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.tgz
            SHA256SUMS.txt
          body_path: ${{ steps.release_notes.outputs.body_path }}
          generate_release_notes: ${{ steps.release_notes.outputs.has_notes != 'true' }}
          # A -dev/-rc Git tag is a preview: never overwrite stable Latest.
          prerelease: ${{ contains(github.ref_name, '-dev.') || contains(github.ref_name, '-rc.') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
          fail_on_unmatched_files: true
